name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint maintained portfolio code
        run: >-
          ruff check src scripts tests
          labs/lab02_preprocessing.py
          labs/lab07_clustering.py
          labs/lab08_decision_tree.py
          labs/lab10_mnist_neural_network.py

      - name: Test
        run: pytest -q
