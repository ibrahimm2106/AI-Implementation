<svg xmlns="http://www.w3.org/2000/svg" width="900" height="290" viewBox="0 0 900 290"><rect width="100%" height="100%" rx="12" fill="#0d1117"/><text x="32" y="45" font-family="monospace" font-size="19" fill="#8b949e"># Lab 07 — Ward hierarchical clustering</text><g font-family="monospace" font-size="18" fill="#e6edf3"><text x="32" y="90">points = list(zip(x, y))</text><text x="32" y="130">linked = linkage(points, method='ward', metric='euclidean')</text><text x="32" y="170">dendrogram(linked)</text><text x="32" y="210">plt.title('Hierarchical Clustering Dendrogram')</text><text x="32" y="250">plt.show()</text></g></svg>