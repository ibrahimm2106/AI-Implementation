<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340"><rect width="100%" height="100%" rx="12" fill="#0d1117"/><text x="32" y="45" font-family="monospace" font-size="19" fill="#8b949e"># Coursework 1 — preprocessing</text><g font-family="monospace" font-size="18" fill="#e6edf3"><text x="32" y="85">df['TotalCharges'] = pd.to_numeric(df['TotalCharges'], errors='coerce')</text><text x="32" y="120">df['TotalCharges'] = df['TotalCharges'].fillna(df['TotalCharges'].median())</text><text x="32" y="155">df = df.drop_duplicates().drop(columns=['customerID'])</text><text x="32" y="190">df = pd.get_dummies(df, drop_first=True)</text><text x="32" y="225">scaler = StandardScaler()</text><text x="32" y="260">df[numerical_features] = scaler.fit_transform(df[numerical_features])</text><text x="32" y="300">df.to_csv('telco_processed.csv', index=False)</text></g></svg>